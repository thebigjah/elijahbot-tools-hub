# Affiliate redirect map - slug -> destination URL.
# Used by generate_redirects.py to produce public/go/<slug>/index.html files.
# Each redirect page is counted as a pageview by Vercel Web Analytics, giving
# you free per-link click totals.

# Place each new affiliate link here, then run:
#   python generate_redirects.py
# Then commit + push - Vercel auto-redeploys.
# Use the canonical URL `tools.purcellventures.co/go/<slug>` (or
# elijahbot-tools-hub.vercel.app/go/<slug> until the domain is wired) in YouTube
# descriptions, blog posts, Instagram bios, etc.

links:
