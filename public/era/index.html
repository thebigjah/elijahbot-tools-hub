<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Era — drop into a year, no hindsight</title>
<meta name="description" content="Pick or roll a year. See it as the people who lived it did — top headlines, music, film, tech, cultural moment. No 'looking back from now.'">
<meta property="og:title" content="Era — drop into a year, no hindsight">
<meta property="og:description" content="Pick or roll a year. See it as people who lived it did.">
<meta property="og:type" content="website">
<style>
  :root {
    --bg: #0f0d0a;
    --panel: #1b1814;
    --panel-2: #25211c;
    --ink: #e8e0d0;
    --ink-soft: #9a8e7a;
    --ink-faint: #6b5e4a;
    --accent: #c2a173;
    --accent-deep: #8a6a3a;
    --border: #34302a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
    background: var(--bg);
    color: var(--ink);
    line-height: 1.55;
    min-height: 100vh;
    padding: 1rem;
  }
  .container { max-width: 720px; margin: 0 auto; }
  header { text-align: center; padding: 2rem 0 2.5rem; }
  header h1 {
    font-family: "Times New Roman", Georgia, serif;
    font-size: clamp(2rem, 6vw, 3rem);
    color: var(--accent);
    letter-spacing: 0.05em;
    margin-bottom: 0.4rem;
  }
  header p {
    color: var(--ink-soft);
    font-style: italic;
    font-size: 0.95rem;
  }

  .picker {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 1.25rem;
    margin-bottom: 1.5rem;
    display: flex;
    flex-wrap: wrap;
    gap: 0.75rem;
    align-items: center;
  }
  .picker label {
    color: var(--ink-soft);
    font-size: 0.85rem;
    text-transform: uppercase;
    letter-spacing: 0.1em;
  }
  select, button {
    background: var(--panel-2);
    color: var(--ink);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 0.6rem 1rem;
    font-family: inherit;
    font-size: 0.95rem;
    cursor: pointer;
  }
  button.primary {
    background: var(--accent);
    color: var(--bg);
    border-color: var(--accent);
    font-weight: 600;
  }
  button.primary:hover { background: var(--accent-deep); border-color: var(--accent-deep); }
  button:hover { border-color: var(--accent); }

  .year-display {
    background: linear-gradient(135deg, var(--panel) 0%, var(--panel-2) 100%);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 2rem 1.5rem;
    text-align: center;
    margin-bottom: 1.5rem;
  }
  .year-display .y {
    font-family: "Times New Roman", Georgia, serif;
    font-size: clamp(4rem, 14vw, 6rem);
    line-height: 1;
    color: var(--accent);
    letter-spacing: -0.02em;
  }
  .year-display .y-sub {
    color: var(--ink-soft);
    font-style: italic;
    margin-top: 0.5rem;
    font-size: 0.95rem;
  }
  .year-display .age {
    color: var(--ink-faint);
    font-size: 0.85rem;
    margin-top: 0.4rem;
  }

  .feed {
    display: grid;
    gap: 1rem;
  }
  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 1.25rem 1.5rem;
  }
  .card .head {
    color: var(--accent);
    font-size: 0.75rem;
    text-transform: uppercase;
    letter-spacing: 0.15em;
    margin-bottom: 0.6rem;
    border-bottom: 1px solid var(--border);
    padding-bottom: 0.5rem;
  }
  .card .item {
    margin-bottom: 0.4rem;
    color: var(--ink);
  }
  .card .item small {
    color: var(--ink-faint);
    margin-left: 0.4rem;
    font-style: italic;
  }
  .card .quote {
    font-family: Georgia, serif;
    font-style: italic;
    color: var(--ink-soft);
    border-left: 3px solid var(--accent-deep);
    padding-left: 1rem;
    margin-top: 0.5rem;
  }

  .row-actions {
    display: flex;
    gap: 0.5rem;
    margin-top: 1.5rem;
    flex-wrap: wrap;
    justify-content: center;
  }
  .row-actions .ghost {
    background: transparent;
    color: var(--ink-soft);
    border: 1px solid var(--border);
  }
  .row-actions .ghost:hover {
    color: var(--ink);
    border-color: var(--accent);
  }

  footer {
    text-align: center;
    margin-top: 2rem;
    color: var(--ink-faint);
    font-size: 0.8rem;
  }
  footer a { color: var(--accent-deep); text-decoration: none; }
</style>
</head>
<body>
<div class="container">

<header>
  <h1>Era</h1>
  <p>drop into a year, no hindsight</p>
</header>

<div class="picker">
  <label for="year-select">Year</label>
  <select id="year-select"></select>
  <button class="primary" id="go-btn">Go</button>
  <button id="random-btn">Surprise me</button>
</div>

<div class="picker" style="font-size:0.85rem;">
  <label for="birth-input" style="text-transform:none;letter-spacing:0;font-size:0.85rem;color:var(--ink-soft);">Born in...</label>
  <input type="number" id="birth-input" placeholder="2007" min="1900" max="2026" style="background:var(--panel-2);color:var(--ink);border:1px solid var(--border);border-radius:6px;padding:0.5rem 0.75rem;font-family:inherit;width:100px;">
  <button id="my-year-btn">Year I was 16</button>
</div>

<div id="content"></div>

<div class="row-actions">
  <button class="ghost" id="share-btn">Share this year</button>
  <button class="ghost" id="next-btn">Next year →</button>
</div>

<footer>
  <p>The point: see history as the people who were there did.<br>
  No "looking back from now." Just the era as it was.<br>
  <a href="https://github.com/thebigjah/era">source</a>
  </p>
</footer>

</div>

const yearSelect = document.getElementById('year-select');
const content = document.getElementById('content');

ERAS.forEach(e => {
  const opt = document.createElement('option');
  opt.value = e.year;
  opt.textContent = e.year + ' — ' + e.sub.substring(0, 60) + (e.sub.length > 60 ? '...' : '');
  yearSelect.appendChild(opt);
});

let currentIndex = 0;

function renderEra(idx) {
  currentIndex = idx;
  const era = ERAS[idx];
  yearSelect.value = era.year;

  const ageNow = 2026 - era.year;
  const ageNote = ageNow > 0 ? `That was ${ageNow} years ago. Someone born then is ${ageNow} today.` : '';

  let html = `
    <div class="year-display">
      <div class="y">${era.year}</div>
      <div class="y-sub">${escapeHtml(era.sub)}</div>
      <div class="age">${ageNote}</div>
    </div>
    <div class="feed">
      ${renderCard('Headlines', era.headlines)}
      ${renderCard('Top of the charts', era.music)}
      ${renderCard('At the movies', era.film)}
      ${renderCard('Tech of the moment', era.tech)}
      ${renderCard('Cultural air', era.culture)}
      ${era.quote ? `<div class="card"><div class="head">A voice from the year</div><div class="quote">${escapeHtml(era.quote)}</div></div>` : ''}
    </div>
  `;
  content.innerHTML = html;
  window.scrollTo({ top: document.querySelector('.year-display').offsetTop - 20, behavior: 'smooth' });
}

function renderCard(heading, items) {
  if (!items || !items.length) return '';
  return `
    <div class="card">
      <div class="head">${escapeHtml(heading)}</div>
      ${items.map(i => `<div class="item">${escapeHtml(i.t)}${i.note ? `<small>${escapeHtml(i.note)}</small>` : ''}</div>`).join('')}
    </div>
  `;
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function jumpToYear(year) {
  const idx = ERAS.findIndex(e => e.year === parseInt(year, 10));
  if (idx >= 0) renderEra(idx);
}

function randomEra() {
  const idx = Math.floor(Math.random() * ERAS.length);
  renderEra(idx);
}

function nextEra() {
  renderEra((currentIndex + 1) % ERAS.length);
}

function shareYear() {
  const era = ERAS[currentIndex];
  const url = new URL(location.href);
  url.hash = 'y=' + era.year;
  const link = url.toString();

  if (navigator.share) {
    navigator.share({
      title: 'Era — ' + era.year,
      text: 'Step into ' + era.year + ': ' + era.sub,
      url: link,
    }).catch(() => copyLink(link));
  } else {
    copyLink(link);
  }
}

function copyLink(link) {
  navigator.clipboard.writeText(link).then(() => {
    alert('Link copied:\n' + link);
  }).catch(() => {
    prompt('Copy this link:', link);
  });
}

function checkHash() {
  const hash = location.hash;
  if (hash.startsWith('#y=')) {
    const y = parseInt(hash.slice(3), 10);
    if (!isNaN(y)) jumpToYear(y);
  } else {
    // Default to a random year on first load
    randomEra();
  }
}

function jumpToYearIWas16() {
  const birth = parseInt(document.getElementById('birth-input').value, 10);
  if (isNaN(birth) || birth < 1900 || birth > 2026) {
    alert('Enter your birth year.');
    return;
  }
  const targetYear = birth + 16;
  // Find the closest year in our list
  const closest = ERAS.reduce((c, e) => Math.abs(e.year - targetYear) < Math.abs(c.year - targetYear) ? e : c);
  jumpToYear(closest.year);
  if (closest.year !== targetYear) {
    setTimeout(() => alert("Closest year we have: " + closest.year + " (you were " + (closest.year - birth) + " then)"), 100);
  }
}

document.getElementById('my-year-btn').addEventListener('click', jumpToYearIWas16);
document.getElementById('birth-input').addEventListener('keypress', e => { if (e.key === 'Enter') jumpToYearIWas16(); });
document.getElementById('go-btn').addEventListener('click', () => jumpToYear(yearSelect.value));
document.getElementById('random-btn').addEventListener('click', randomEra);
document.getElementById('share-btn').addEventListener('click', shareYear);
document.getElementById('next-btn').addEventListener('click', nextEra);
yearSelect.addEventListener('change', () => jumpToYear(yearSelect.value));

checkHash();
</script>
