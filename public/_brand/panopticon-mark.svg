<?xml version="1.0" encoding="UTF-8"?>
<!--
  Panopticon mark — transparent background variant.
  Same geometry as panopticon.svg but no fill rect, no PV monogram clearing,
  so it can sit on any background as a pure logo glyph.
  Gold #d4af37.
-->
